services:
  sync-agent:
    build: .
    environment:
      LOCAL_MONITOR_URL: ${LOCAL_MONITOR_URL:-http://host.docker.internal:7878}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      CLOUD_HUB_URL: ${CLOUD_HUB_URL:?请在 .env 中配置 CLOUD_HUB_URL}
      CLOUD_API_KEY: ${CLOUD_API_KEY:?请在 .env 中配置 CLOUD_API_KEY}
      # 设备身份：显式配置最稳妥；留空则首次生成 UUID 持久化到状态卷
      DEVICE_ID: ${DEVICE_ID:-}
      DEVICE_NAME: ${DEVICE_NAME:-}
      HOST_PLATFORM: ${HOST_PLATFORM:-}
      SOURCE_INSTANCE_ID: ${SOURCE_INSTANCE_ID:-}
      TOKEN_MONITOR_DEVICE_ID: ${TOKEN_MONITOR_DEVICE_ID:-}
      TIME_ZONE: ${TIME_ZONE:-Asia/Tokyo}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-15}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      BATCH_SIZE: ${BATCH_SIZE:-200}
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-false}
      # 逃生阀（错误提示引用的补救开关必须能从 compose 传进容器）
      ALLOW_LEGACY_FALLBACK: ${ALLOW_LEGACY_FALLBACK:-false}
      ALLOW_STATE_CONFLICT: ${ALLOW_STATE_CONFLICT:-false}
      RUN_ONCE: ${RUN_ONCE:-false}
      # 可选：token-monitor 桥接
      TOKEN_MONITOR_HUB_URL: ${TOKEN_MONITOR_HUB_URL:-}
      TOKEN_MONITOR_SECRET: ${TOKEN_MONITOR_SECRET:-}
      TOKEN_MONITOR_INTERVAL_SECONDS: ${TOKEN_MONITOR_INTERVAL_SECONDS:-300}
      HEALTH_STALE_SECONDS: ${HEALTH_STALE_SECONDS:-3600}
    volumes:
      - agent-state:/data
    # Linux 宿主机上 host.docker.internal 需要显式映射
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  agent-state:

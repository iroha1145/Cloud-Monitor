# 用 GitHub Actions 云端构建原生安卓 APK（Jetpack Compose），本机无需 JDK / Android SDK。
#
# 前置（Settings → Secrets and variables → Actions）：
#   Secrets（可选，正式签名；不配则 CI 生成临时 keystore，Artifact 名带 -debug）：
#     ANDROID_KEYSTORE_B64       keystore 的 base64
#     ANDROID_KEYSTORE_PASSWORD  keystore 密码
#     ANDROID_KEY_PASSWORD       密钥密码（可省略，默认与 keystore 密码相同）
#     ANDROID_KEY_ALIAS          密钥别名（默认 cloudmonitor）
#
# 产物只上传 Artifact，不创建 GitHub Release，避免干扰面板「检索更新」。
name: build-apk

on:
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: "运行安卓 14 和 17 模拟器界面测试"
        type: boolean
        default: true
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
      - "VERSION"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/gradle/libs.versions.toml

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装安卓 17 SDK
        working-directory: .
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: 编译、静态检查与单元测试
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest assembleDebugAndroidTest --no-daemon --stacktrace

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore

      - name: 准备签名 keystore
        working-directory: .
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          ALIAS="${ANDROID_KEY_ALIAS:-cloudmonitor}"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
              echo "::error::配置了 ANDROID_KEYSTORE_B64 就必须同时配置 ANDROID_KEYSTORE_PASSWORD"
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            PW="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PW="${ANDROID_KEY_PASSWORD:-$PW}"
            echo "KEYSTORE_SOURCE=release" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 ANDROID_KEYSTORE_B64：使用 CI 临时调试 keystore 签名（每次构建指纹都不同，仅供测试安装）。"
            PW="cloudmonitor-ci"
            KEY_PW="$PW"
            keytool -genkeypair -v -keystore "$KS" -storepass "$PW" -keypass "$KEY_PW" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Cloud Monitor, OU=Cloud-Monitor, O=iroha1145"
            echo "KEYSTORE_SOURCE=debug" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: 构建 Release APK（64 位）
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          VERSION_NAME=$(tr -d ' \n' < ../VERSION)
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PversionCode="$((20000 + ${{ github.run_number }}))" \
            -PversionName="$VERSION_NAME"
          ls -lh app/build/outputs/apk/release/
          for APK in app/build/outputs/apk/release/*.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"
          done

      - name: 打印签名指纹
        working-directory: .
        run: |
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | grep -E "SHA256:|SHA1:" || true

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          # 注意：GitHub 表达式里空串是 falsy，`&& '' ||` 会恒取回退值，两个分支都必须给非空串
          name: ${{ env.KEYSTORE_SOURCE == 'release' && 'cloud-monitor-apk' || 'cloud-monitor-apk-debug' }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  device-tests:
    if: github.event_name == 'pull_request' || inputs.run_device_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SERIAL: emulator-5554
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: "34"
            image: google_apis
          - api: "37.0"
            image: google_apis_ps16k
    steps:
      - uses: actions/checkout@v4
      - name: 设置模拟器目录
        run: |
          mkdir -p "$RUNNER_TEMP/cloud-monitor-avd" "$RUNNER_TEMP/cloud-monitor-android"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/cloud-monitor-avd" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/cloud-monitor-android" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/gradle/libs.versions.toml
      - uses: android-actions/setup-android@v3
      - name: 安装模拟器运行库
        timeout-minutes: 5
        run: |
          # The emulator links libpulse even when started with -no-audio.
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0
      - name: 启用模拟器硬件加速
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 安装测试设备
        env:
          TEST_API: ${{ matrix.api }}
          IMAGE_TARGET: ${{ matrix.image }}
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-$TEST_API;$IMAGE_TARGET;x86_64"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | avdmanager create avd -n cloud-monitor-ci -k "system-images;android-$TEST_API;$IMAGE_TARGET;x86_64" --device pixel_6 --path "$ANDROID_AVD_HOME/cloud-monitor-ci.avd" --force
          # Android 17's 16 KB image needs more writable space than the AVD default.
          sed -i '/^disk\.dataPartition\.size[[:space:]]*=/d' "$ANDROID_AVD_HOME/cloud-monitor-ci.avd/config.ini"
          echo 'disk.dataPartition.size=6G' >> "$ANDROID_AVD_HOME/cloud-monitor-ci.avd/config.ini"
          test -f "$ANDROID_AVD_HOME/cloud-monitor-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx cloud-monitor-ci
      - name: 启动设备并运行界面测试
        id: device_tests
        timeout-minutes: 25
        working-directory: android
        env:
          TEST_API: ${{ matrix.api }}
        run: |
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/emulator/emulator" -list-avds
          df -h "$RUNNER_TEMP"
          free -h
          timeout 15 adb start-server
          CI_GRAPHICS_FEATURES=()
          if [ "$TEST_API" = "37.0" ]; then
            # Android 17's mapper requires ReadColorBufferDMA, advertised only with both features.
            CI_GRAPHICS_FEATURES=(-feature GLDirectMem -feature HasSharedSlotsHostMemoryAllocator)
          fi
          "$ANDROID_HOME/emulator/emulator" -avd cloud-monitor-ci -port 5554 -memory 4096 -partition-size 6144 -wipe-data -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader "${CI_GRAPHICS_FEATURES[@]}" > "$RUNNER_TEMP/emulator.log" 2>&1 &
          CI_EMULATOR_PID=$!
          echo "$CI_EMULATOR_PID" > "$RUNNER_TEMP/emulator.pid"
          CI_BOOT_DEADLINE=$((SECONDS + 180))
          CI_BOOT_COMPLETE=false
          CI_READY_PIDS=""
          CI_READY_SINCE=$SECONDS
          until [ "$SECONDS" -ge "$CI_BOOT_DEADLINE" ]; do
            if ! kill -0 "$CI_EMULATOR_PID" 2>/dev/null; then
              echo "::error::模拟器进程在设备连接前退出"
              cat "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            if [ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then
              if [ "$TEST_API" != "37.0" ]; then
                CI_BOOT_COMPLETE=true
                break
              fi
              CI_USER_STATE="$(timeout 5 adb shell am get-started-user-state 0 2>/dev/null | tr -d '\r' || true)"
              CI_CURRENT_PIDS="$(timeout 5 adb shell pidof system_server surfaceflinger 2>/dev/null | tr -d '\r' || true)"
              if [ "$CI_USER_STATE" = "RUNNING_UNLOCKED" ] && [[ "$CI_CURRENT_PIDS" =~ ^[0-9]+[[:space:]]+[0-9]+$ ]]; then
                if [ "$CI_CURRENT_PIDS" != "$CI_READY_PIDS" ]; then
                  CI_READY_PIDS="$CI_CURRENT_PIDS"
                  CI_READY_SINCE=$SECONDS
                elif [ $((SECONDS - CI_READY_SINCE)) -ge 60 ]; then
                  echo "安卓 17 用户已解锁，系统及显示服务已连续稳定 60 秒：$CI_READY_PIDS"
                  CI_BOOT_COMPLETE=true
                  break
                fi
              else
                CI_READY_PIDS=""
                CI_READY_SINCE=$SECONDS
              fi
            else
              CI_READY_PIDS=""
              CI_READY_SINCE=$SECONDS
            fi
            sleep 2
          done
          if [ "$CI_BOOT_COMPLETE" != true ]; then
            echo "::error::模拟器未在 180 秒内达到可测试状态"
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          timeout 10 adb shell settings put global window_animation_scale 0
          timeout 10 adb shell settings put global transition_animation_scale 0
          timeout 10 adb shell settings put global animator_duration_scale 0
          timeout 10 adb shell getconf PAGE_SIZE
          timeout 10 adb shell df -h /data
          timeout 10 adb shell head -n 5 /proc/meminfo
          ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace \
            -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
          # AGP can exit successfully after an APK installation failure with no tests run.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/outputs/androidTest-results/connected/debug").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("::error::没有设备测试 XML 报告，测试可能未实际执行")
          test_cases = set()
          for report in reports:
              root = ET.parse(report).getroot()
              test_cases.update((case.get("classname"), case.get("name")) for case in root.iter("testcase"))
              for suite in root.iter():
                  if suite.tag in {"testsuites", "testsuite"}:
                      for key in ("failures", "errors", "skipped"):
                          if int(suite.get(key, "0")) != 0:
                              raise SystemExit(f"::error::{report.name}: {key}={suite.get(key)}")
              for tag in ("failure", "error", "skipped"):
                  if next(root.iter(tag), None) is not None:
                      raise SystemExit(f"::error::{report.name}: 存在 {tag} 用例")
          if len(test_cases) < 6:
              raise SystemExit(f"::error::设备测试实际执行 {len(test_cases)} 项，少于要求的 6 项")
          print(f"设备测试报告验证通过：{len(test_cases)} 项，失败、错误及跳过均为 0")
          PY
      - name: 收集设备日志
        if: always()
        timeout-minutes: 2
        run: |
          timeout 15 adb logcat -d > "$RUNNER_TEMP/logcat.txt" || true
          if ! timeout 30 adb pull /sdcard/Android/data/io.github.iroha1145.cloudmonitor.debug/files/screenshots "$RUNNER_TEMP/screenshots"; then
            if [ "${{ steps.device_tests.outcome }}" = "success" ]; then
              echo "::error::界面测试通过，但未能收集测试截图"
              exit 1
            fi
          fi
      - name: 关闭测试设备
        if: always()
        timeout-minutes: 1
        run: |
          timeout 10 adb emu kill || true
          if [ -f "$RUNNER_TEMP/emulator.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/emulator.pid")" 2>/dev/null || true
          fi
      - name: 上传设备测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-tests-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/logcat.txt
            ${{ runner.temp }}/screenshots/
          if-no-files-found: ignore

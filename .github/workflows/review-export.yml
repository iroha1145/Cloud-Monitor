name: Export review patch
on:
  push:
    branches: [fix/deep-review-20260906]
    paths: [.github/workflows/review-export.yml]
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'iroha1145/Cloud-Monitor' && github.ref == 'refs/heads/fix/deep-review-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checksum-verified review delta and remove transport
        env:
          PATCH_DATA: >-
            
        run: |
          set -euo pipefail
          git diff --quiet 4f65b79dd927e432aeffd75732ca530fa0afca48 HEAD -- . ':!.github/workflows/review-export.yml'
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          patch = gzip.decompress(base64.b64decode(os.environ['PATCH_DATA']))
          assert hashlib.sha256(patch).hexdigest() == '5d3665df181865a68921ac3c83e7909bdcf242be6e8559e6d8ee690aa2829394'
          pathlib.Path('/tmp/review-followup.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/review-followup.patch
          git apply --index /tmp/review-followup.patch
          git rm .github/workflows/review-export.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reject nonfinite validation input and handle timestamp and pagination bounds'
          git push origin HEAD:fix/deep-review-20260906

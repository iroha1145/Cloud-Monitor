# §13 CI 片段：放入仓库 .github/workflows/frontend-tests.yml 即可复跑。
# 前置：仓库根含后端基线（hub/backend + hub/frontend），前端测试位于 hub/frontend/tests。
name: frontend-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: 安装后端依赖
        run: pip install -r hub/requirements.txt
      - name: 安装测试依赖
        run: |
          cd hub/frontend/tests
          npm ci --no-bin-links   # 某些文件系统（fuse/9p）不支持 symlink
          # --no-bin-links 下没有 node_modules/.bin/playwright，npx 解析不到
          # （sh: playwright: not found）；与 package.json 同一习语直呼 cli.js
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: 静态检查 + 全部 Playwright 测试（含真实 FastAPI 夹具、axe、截图）
        run: cd hub/frontend/tests && npm test
        env:
          CM_BASELINE: ${{ github.workspace }}          # 后端基线路径（start-e2e-server.sh 会复制为 scratch 夹具）
          CM_E2E_PORT: "18787"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence
          path: hub/frontend/tests/evidence/

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hub/dashboard/package-lock.json
      - name: 安装后端和前端依赖
        run: |
          pip install -r hub/requirements.txt pytest
          cd hub/dashboard
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 数据契约、正式版和演示版构建
        working-directory: hub/dashboard
        run: |
          npm test
          npm run build
          npm run build:showcase
      - name: 手机交互和真实后端登录检查
        working-directory: hub/dashboard
        run: |
          npm run test:e2e
          npm run test:hosted
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dashboard-evidence
          path: |
            hub/dashboard/evidence/
            hub/dashboard/test-results/

# 本地复跑：
#   cd hub/frontend/tests
#   npm install --no-bin-links && node node_modules/@playwright/test/cli.js install chromium
#   CM_BASELINE=/path/to/cm-current npm test   # 默认自动使用仓库根目录
# 说明：playwright.config.js 的 webServer 会自动执行 start-e2e-server.sh，
# 将 CM_BASELINE 复制到 $HOME/cm-e2e、覆盖 hub/frontend/ 页面文件后起
# 真实 uvicorn（ACCESS_TOKEN=e2e-read-token-0123456789abcdef0123456789）。reuseExistingServer=true，
# 已起服务时直接复用。

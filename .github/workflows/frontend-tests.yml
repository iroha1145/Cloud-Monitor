# 面板（hub/dashboard）的单元测试、两种构建、浏览器测试与正式登录流程。
name: frontend-tests
on: [push, pull_request]
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: hub/dashboard/package-lock.json
      - name: 安装后端和前端依赖
        run: |
          pip install -r hub/requirements.txt pytest
          cd hub/dashboard
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 数据契约、正式版和演示版构建
        working-directory: hub/dashboard
        run: |
          npm test
          npm run build
          npm run build:showcase
      - name: 手机交互和真实后端登录检查
        working-directory: hub/dashboard
        run: |
          npm run test:e2e
          npm run test:hosted
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: dashboard-evidence
          path: |
            hub/dashboard/evidence/
            hub/dashboard/test-results/


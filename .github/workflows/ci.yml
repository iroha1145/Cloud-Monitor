name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: 安装依赖（含 pip-audit）
        run: |
          python -m pip install --upgrade pip
          pip install -r hub/requirements.txt pytest pip-audit
          pip install -r agent/requirements.txt
      - name: compileall
        run: python -m compileall -q hub/backend agent/sync_agent.py agent/token_monitor_bridge.py agent/healthcheck.py
      - name: node --check（tm-core 启动器与载荷生成器）
        run: |
          node --check hub/tm-core/run.js
          node --check hub/tm-core/make_payload.js
      - name: vendored 核心完整性（SHA-256 manifest 逐文件校验）
        run: |
          cd hub/tm-core/vendor
          grep -qE '^[a-f0-9]{64}  ' MANIFEST.txt || { echo "manifest empty"; exit 1; }
          python3 - <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(".")
          bad = []
          for line in (root / "MANIFEST.txt").read_text().splitlines():
              parts = line.split("  ")
              if len(parts) != 2 or len(parts[0]) != 64:
                  continue
              expected, rel = parts
              actual = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              if actual != expected:
                  bad.append(rel)
          if bad:
              sys.exit("MISMATCH: " + ", ".join(bad))
          print("vendor integrity OK")
          PY
      - name: hub 测试（含官方 Node hub 差分与可靠性故障路径）
        run: cd hub && PYTHONPATH=backend python -m pytest tests/ -q
      - name: Cloud 扩展专项（provider-status / history-daily / coverage / prune / fixtures）
        run: |
          cd hub && PYTHONPATH=backend python -m pytest tests/test_provider_status.py tests/test_history_daily.py tests/test_activity_coverage.py tests/test_prune_snapshots.py tests/test_frontend_contract_export.py -q
      - name: agent 测试
        run: cd agent && python -m pytest tests/ -q
      - name: pip-audit（依赖漏洞；默认失败。若必须忽略：--ignore-vuln ID 且在注释写明原因与到期日）
        run: |
          # 新增 CVE 时不得 `|| true`；只能带到期日的显式 --ignore-vuln。
          pip-audit -r hub/requirements.txt
          # agent/ 本轮禁止改动。requests 2.32.3:
          #   PYSEC-2026-1872 (fix 2.32.4), PYSEC-2026-2275 (fix 2.33.0)
          # ignore 到期 2026-11-23：跟进单独 PR 升级 agent 依赖。
          pip-audit -r agent/requirements.txt \
            --ignore-vuln PYSEC-2026-1872 \
            --ignore-vuln PYSEC-2026-2275

  docker-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: compose 配置校验
        env:
          API_KEY: ci-placeholder-key-0123456789abcdef
          ACCESS_TOKEN: ci-placeholder-read-0123456789abcdef
          TOKEN_MONITOR_SECRET: ci-placeholder-tm-0123456789abcdef
        run: docker compose -f hub/docker-compose.yml config >/dev/null
      - name: 构建镜像
        run: |
          docker build -t cloud-monitor-hub ./hub
          docker build -t cloud-monitor-tm-core ./hub/tm-core
          docker build -t cloud-monitor-agent ./agent
      - name: compose 启动并做端到端冒烟
        env:
          API_KEY: ci-placeholder-key-0123456789abcdef
          ACCESS_TOKEN: ci-placeholder-read-0123456789abcdef
          TOKEN_MONITOR_SECRET: ci-placeholder-tm-0123456789abcdef
        # 冒烟必须真的断言：此前 curl 全部无 -f、readiness 超时不 fail、
        # SSE 非零退出被 head 吞——503/401/未就绪照样全绿
        run: |
          set -euo pipefail
          cd hub
          docker compose up -d
          ready=0
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:7878/api/v1/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::hub 40s 内未就绪"
            docker compose logs
            exit 1
          fi
          echo "== ready =="
          curl -sf http://127.0.0.1:7878/api/v1/health/ready
          echo ""
          echo "== ingest =="
          ingest=$(curl -sf -X POST http://127.0.0.1:7878/api/ingest \
            -H "X-Token-Monitor-Secret: ci-placeholder-tm-0123456789abcdef" \
            -H "content-type: application/json" \
            -d '{"deviceId":"ci-device","periodWindows":{"timeZone":"UTC"},"today":{"totalTokens":42,"clients":{"codex":42}}}')
          echo "$ingest" | head -c 300; echo ""
          echo "$ingest" | grep -q '"stats"' || { echo "::error::ingest 响应缺少 stats"; docker compose logs; exit 1; }
          echo "== stats =="
          stats=$(curl -sf -H "X-Token-Monitor-Secret: ci-placeholder-tm-0123456789abcdef" http://127.0.0.1:7878/api/stats)
          echo "$stats" | head -c 300; echo ""
          echo "$stats" | grep -q 'ci-device' || { echo "::error::stats 未包含已 ingest 的设备"; docker compose logs; exit 1; }
          echo "== overview =="
          overview=$(curl -sf -H "Authorization: Bearer ci-placeholder-read-0123456789abcdef" http://127.0.0.1:7878/api/v1/tm/overview)
          echo "$overview" | head -c 300; echo ""
          echo "$overview" | grep -q '"totals"' || { echo "::error::overview 缺少 totals"; docker compose logs; exit 1; }
          echo "== SSE 首帧 =="
          # SSE 是无限流：--max-time 到点 curl 必然非零退出，不能用 -f 判；
          # 以「3 秒内是否收到 data: 帧」为断言
          sse=$(curl -s -N --max-time 3 -H "X-Token-Monitor-Secret: ci-placeholder-tm-0123456789abcdef" http://127.0.0.1:7878/api/stats/stream || true)
          printf '%s\n' "$sse" | head -2
          printf '%s' "$sse" | grep -q 'data:' || { echo "::error::SSE 3 秒内无 data 帧"; docker compose logs; exit 1; }
          docker compose down

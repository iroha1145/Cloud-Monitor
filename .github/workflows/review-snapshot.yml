name: Review source snapshot
on:
  push:
    branches: [fix/deep-review-20260906]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify locked frontend
        working-directory: hub/dashboard
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Archive dependencies and compiled UI for local browser review
        run: tar -cf /tmp/cloud-monitor-review-deps.tar hub/dashboard/node_modules hub/frontend/app
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-monitor-review-deps
          path: /tmp/cloud-monitor-review-deps.tar
          retention-days: 1

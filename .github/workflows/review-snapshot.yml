name: Review source snapshot
on:
  push:
    branches: [fix/deep-review-20260906]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'iroha1145/Cloud-Monitor' && github.ref == 'refs/heads/fix/deep-review-20260906'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply reviewed source diff
        env:
          REVIEW_PATCH: >-
            
            
        run: |
          set -euo pipefail
          git diff --quiet ef3daa6f405cbd6b68eb59c8f1b9fe5f56914dbf HEAD -- . ':!.github/workflows/review-snapshot.yml'
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          patch = gzip.decompress(base64.b64decode(os.environ['REVIEW_PATCH']))
          assert hashlib.sha256(patch).hexdigest() == 'beefa79a655e806e35b1500c3750c44253ccc19d68817f0c1a27a3e1e70b4296', 'patch checksum mismatch'
          pathlib.Path('/tmp/review.patch').write_bytes(patch)
          PY
          git apply --index --check /tmp/review.patch
          git apply --index /tmp/review.patch
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: address full-stack review findings with regression coverage'
          git push origin HEAD:fix/deep-review-20260906

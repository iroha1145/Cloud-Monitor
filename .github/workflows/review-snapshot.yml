name: Review source snapshot
on:
  push:
    branches: [fix/deep-review-20260906]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for isolated review
        run: git archive --format=tar HEAD > /tmp/cloud-monitor-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-monitor-review-source
          path: /tmp/cloud-monitor-source.tar
          retention-days: 1

services:
  cloud-hub:
    build: .
    # 默认只绑定回环地址，公网访问请经 Nginx/Caddy HTTPS 反代
    ports:
      - "127.0.0.1:7878:7878"
    environment:
      # 必填强随机密钥（≥32 随机字符，弱值/默认值/彼此相同都会拒绝启动）
      API_KEY: ${API_KEY:?请在 .env 配置强随机 API_KEY}
      # 只读密钥（网页/看板用），必须与 API_KEY 不同；如需共用显式 ALLOW_SHARED_TOKEN=true
      ACCESS_TOKEN: ${ACCESS_TOKEN:?请在 .env 配置与 API_KEY 不同的只读 ACCESS_TOKEN}
      ALLOW_SHARED_TOKEN: ${ALLOW_SHARED_TOKEN:-false}
      # token-monitor 接入密钥（widget 推送用；与上面两个密钥都不同）
      TOKEN_MONITOR_SECRET: ${TOKEN_MONITOR_SECRET:-}
      # 官方协议权威（tm-core 服务）地址
      TM_CORE_URL: http://tm-core:17321
      # 可选：每设备独立写密钥 {"device-id": "key"}（OpenWebUI 记录链路）
      DEVICE_KEYS_JSON: ${DEVICE_KEYS_JSON:-}
      MAX_RECORDS_PER_PUSH: ${MAX_RECORDS_PER_PUSH:-500}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      DASHBOARD_TIME_ZONE: ${DASHBOARD_TIME_ZONE:-Asia/Tokyo}
      PROVIDER_STATUS_ENABLED: ${PROVIDER_STATUS_ENABLED:-true}
      PROVIDER_STATUS_CACHE_SECONDS: ${PROVIDER_STATUS_CACHE_SECONDS:-300}
      PROVIDER_STATUS_TIMEOUT_SECONDS: ${PROVIDER_STATUS_TIMEOUT_SECONDS:-2.5}
      # true：/ 直接进入演示面板（假数据）；实机务必 false
      CM_DEMO: ${CM_DEMO:-false}
    volumes:
      - cloud-hub-data:/data
    depends_on:
      tm-core:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # vendored 官方 token-monitor hub（协议权威：规范化/合并/聚合/过期/SSE/订阅）
  tm-core:
    build: ./tm-core
    environment:
      TOKEN_MONITOR_SECRET: ${TOKEN_MONITOR_SECRET:-}
      TOKEN_MONITOR_PORT: "17321"
      TOKEN_MONITOR_HOST: 0.0.0.0
      TOKEN_MONITOR_DATA_FILE: /data/devices.json
      NODE_OPTIONS: "--max-old-space-size=128"
    volumes:
      - tm-core-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

volumes:
  cloud-hub-data:
  tm-core-data:

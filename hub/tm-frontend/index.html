<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Token Monitor · 云端用量面板</title>
    <link rel="stylesheet" href="/tm/tm.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap">
        <h1>Token Monitor <span class="sub">云端用量面板</span></h1>
        <div class="actions">
          <span id="generated-at" class="muted"></span>
          <button id="refresh" class="btn" type="button">刷新</button>
          <button id="logout" class="btn ghost" type="button" hidden>退出</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section id="login" class="card login" hidden>
        <h2>访问验证</h2>
        <p class="muted">请输入云端 hub 的只读密钥（ACCESS_TOKEN）。</p>
        <form id="login-form">
          <input id="token" type="password" placeholder="ACCESS_TOKEN" autocomplete="off" />
          <button class="btn" type="submit">查看</button>
        </form>
        <p id="login-error" class="error" hidden></p>
      </section>

      <section id="content" hidden>
        <div class="cards" id="period-cards"></div>

        <div class="grid">
          <section class="card">
            <h2>近 30 天趋势</h2>
            <div id="trend" class="trend"></div>
          </section>
          <section class="card">
            <h2>今日模型分布</h2>
            <div id="models" class="bars"></div>
          </section>
        </div>

        <div class="grid">
          <section class="card">
            <h2>设备</h2>
            <div class="table-wrap">
              <table id="devices">
                <thead>
                  <tr>
                    <th>设备</th><th>平台</th><th>今日</th><th>本月</th><th>累计</th><th>最近上报</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </section>
          <section class="card">
            <h2>今日客户端</h2>
            <div id="clients" class="bars"></div>
          </section>
        </div>
      </section>

      <p id="empty" class="muted center" hidden>
        还没有设备数据。在 token-monitor 的设置里启用多设备同步，
        hub 填本服务器地址、密钥填 TOKEN_MONITOR_SECRET 即可。
      </p>
    </main>

    <script src="/tm/tm.js"></script>
  </body>
</html>
